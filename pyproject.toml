[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-librarian"
version = "1.0.0"
description = "Zero-daemon, two-tier on-demand skill loader and CLI manager that eliminates startup context window bloat in Claude Code, Antigravity, and OpenCode."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = [
    "claude-code",
    "ai-agents",
    "skills",
    "context-window",
    "token-optimization",
    "antigravity",
    "opencode",
    "llm-tools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://github.com/psthi/skill-librarian"
Repository = "https://github.com/psthi/skill-librarian"
Issues = "https://github.com/psthi/skill-librarian/issues"

[tool.setuptools]
script-files = ["bin/skill-lib"]
